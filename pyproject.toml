[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalm"
version = "1.0.0"
description = "Kalm — KDE Kirigami noise cancellation & multi-earbud controller for vivo / iQOO TWS on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PySide6>=6.6",
    "PyGObject>=3.46",
]

[project.scripts]
kalm = "main:main"
