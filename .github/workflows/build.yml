name: Build Windows (x64)

on:
  push:
    branches: [windows]
    tags: ["v*-win*"]
  pull_request:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build Windows Installer & Portable ZIP (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.8 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          cache: true

      - name: Build Kalm with CMake & Ninja
        shell: pwsh
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run unit & handle leak tests
        shell: pwsh
        run: ctest --test-dir build --output-on-failure -V

      - name: Package Portable ZIP & Inno Setup Installer (.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Kalm-win64 | Out-Null
          Copy-Item build/kalm.exe dist/Kalm-win64/kalm.exe
          Copy-Item models.json dist/Kalm-win64/models.json
          Copy-Item README.md dist/Kalm-win64/README.md
          Copy-Item -Recurse translations dist/Kalm-win64/translations

          windeployqt --release --qmldir qml --no-translations --no-opengl-sw --compiler-runtime dist/Kalm-win64/kalm.exe

          # Verify deployed executable runs cleanly
          $ver = & ./dist/Kalm-win64/kalm.exe --version
          Write-Host "Verified binary version: $ver"

          Compress-Archive -Path "dist/Kalm-win64/*" -DestinationPath "dist/Kalm-win64-portable.zip" -Force

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "packaging\windows\kalm.iss"

          Push-Location dist
          $hashes = Get-FileHash -Algorithm SHA256 Kalm-win64-setup.exe, Kalm-win64-portable.zip |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          $hashes | Set-Content -Encoding ascii SHA256SUMS-windows.txt
          Get-ChildItem Kalm-win64-setup.exe, Kalm-win64-portable.zip, SHA256SUMS-windows.txt
          Pop-Location

      - name: Upload Windows CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kalm-windows-x64-artifacts
          path: |
            dist/Kalm-win64-setup.exe
            dist/Kalm-win64-portable.zip
            dist/SHA256SUMS-windows.txt

      - name: Publish Windows Release (windows branch)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: windows
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            dist/Kalm-win64-setup.exe
            dist/Kalm-win64-portable.zip
            dist/SHA256SUMS-windows.txt
