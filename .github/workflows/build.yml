name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Binary & AppImage (x86_64)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - name: Install build and Qt6/Kirigami dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            cmake \
            curl \
            desktop-file-utils \
            file \
            g++ \
            git \
            kde-style-breeze \
            kf6-breeze-icon-theme \
            libqt6svg6 \
            make \
            patchelf \
            python3 \
            qmake6 \
            qml6-module-org-kde-coreaddons \
            qml6-module-org-kde-desktop \
            qml6-module-org-kde-iconthemes \
            qml6-module-org-kde-kirigami \
            qml6-module-org-kde-kirigamiaddons-components \
            qml6-module-org-kde-kirigamiaddons-datetime \
            qml6-module-org-kde-kirigamiaddons-delegates \
            qml6-module-org-kde-kirigamiaddons-formcard \
            qml6-module-org-kde-kitemmodels \
            qml6-module-org-kde-sonnet \
            qml6-module-qt-labs-platform \
            qml6-module-qt-labs-qmlmodels \
            qml6-module-qt-labs-settings \
            qml6-module-qtcore \
            qml6-module-qtqml \
            qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-effects \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-nativestyle \
            qml6-module-qtquick-shapes \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-vectorimage \
            qml6-module-qtquick-window \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-qpa-plugins \
            qt6-svg-plugins \
            qt6-wayland \
            qt6-xdgdesktopportal-platformtheme

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Kalm (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Run unit & leak tests
        run: ctest --test-dir build --output-on-failure -V

      - name: Package standalone binary & self-contained AppImage
        run: |
          mkdir -p dist
          cp build/kalm dist/kalm-linux-x86_64
          strip -s dist/kalm-linux-x86_64
          chmod +x dist/kalm-linux-x86_64 ./scripts/build-appimage.sh
          ./scripts/build-appimage.sh build dist/Kalm-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/Kalm-x86_64.AppImage --version
          (cd dist && sha256sum Kalm-x86_64.AppImage kalm-linux-x86_64 > SHA256SUMS)
          ls -lh dist/

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kalm-linux-x86_64-artifacts
          path: |
            dist/Kalm-x86_64.AppImage
            dist/kalm-linux-x86_64
            dist/SHA256SUMS

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Kalm-x86_64.AppImage
            dist/kalm-linux-x86_64
            dist/SHA256SUMS
