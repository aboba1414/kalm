name: Bug Report
description: Report a bug, connection failure, or UI glitch
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: env
    attributes:
      label: Distribution & Desktop Environment
      placeholder: e.g. Fedora 45, KDE Plasma 6.8 (Wayland)
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Earbud Model & Kalm Version
      placeholder: e.g. vivo TWS 5 Hi-Fi, kalm 0.2.0
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What Happened & Steps to Reproduce
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Output (`kalm status` / `kalm probe`)
      render: shell
